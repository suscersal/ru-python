name: Update Download Count Badge

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  update-badge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get download count
        id: count
        run: |
          curl -s -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"suscersal.russ-python"}]}],"flags":914}' \
            > /tmp/marketplace.json
          
          COUNT=$(python3 -c "import json; f=open('/tmp/marketplace.json'); d=json.load(f); stats=d['results'][0]['extensions'][0]['statistics']; print(int([s['value'] for s in stats if s['statisticName']=='downloadCount'][0]))")
          
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Download count: $COUNT"
      
      - name: Update README
        run: |
          sed -i "s/downloads-[0-9]+/downloads-${COUNT}/" README.md
        env:
          COUNT: ${{ steps.count.outputs.count }}
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update downloads"; git push)
        env:
          COUNT: ${{ steps.count.outputs.count }}
