name: Автоматическая сборка раз в три дня

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  build:
    name: Сборка проекта
    runs-on: windows-latest

    env:
      PYTHONUTF8: 1

    steps:
      - name: Копирование кода
        uses: actions/checkout@v4

      - name: Установка Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Мы убрали строку с кэшем, чтобы не было ошибок

      - name: Подготовка окружения
        # Установим wheel и pyinstaller на всякий случай, если ваш скрипт их ждет
        run: python -m pip install --upgrade pip wheel pyinstaller

      - name: Запуск скрипта сборки (build.py)
        run: python build.py



      - name: Сохранение готового файла
        if: always() # Попытаться сохранить, даже если билд упал (чтобы посмотреть логи)
        uses: actions/upload-artifact@v4
        with:
          name: rupython
          path: |
            dist/
            *.exe
            *.log
      
      - name: Создать Релиз и загрузить EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # Создаст релиз, только если вы создадите тег
        with:
          files: |
            dist/*.exe
            rupython.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

