name: Автоматическая сборка раз в три дня

on:
  push:
      paths: ['.github/workflows/build.yml']
  schedule:
    - cron: '0 0 */3 * *' # Запуск каждые 3 дня в 00:00 UTC
  workflow_dispatch: # Возможность ручного запуска

# Права расширены для возможности пушить изменения кода (contents: write)
permissions:
  contents: write

jobs:
  build:
    name: Сборка проекта
    runs-on: windows-latest

    env:
      PYTHONUTF8: 1

    steps:
      - name: Копирование кода
        uses: actions/checkout@v4
        with:
          # По умолчанию checkout скачивает detached HEAD. 
          # Указываем ref, чтобы git push знал, в какую ветку отправлять изменения.
          ref: ${{ github.head_ref || github.ref_name }}

      # Шаг для генерации точной даты и времени сборки
      - name: Получение даты и времени
        id: datetime
        shell: powershell
        run: |
          $current_time = Get-Date -Format "dd.MM.yyyy HH:mm"
          echo "build_time=$current_time" >> $env:GITHUB_OUTPUT

      - name: Установка Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Запуск скрипта сборки (build.py)
        run: python build.py


      - name: Проверка работоспособности параметров
        env:
          PYTHONUTF8: "1"  
        run: dist/rupython.exe --install ursina


      - name: Установка Node.js (для сборки VS Code расширения)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка расширения VS Code и автоповышение версии
        id: vsce_setup
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install -g @vscode/vsce
          cd rus-python
          
          # ЧИТАЕМ СТРОГО В UTF-8
          $json = Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json
          
          # АВТОПОВЫШЕНИЕ ВЕРСИИ
          if ($json.version) {
              $versionParts = $json.version.Split('.')
              if ($versionParts.Count -eq 3) {
                  $major = [int]$versionParts[0]
                  $minor = [int]$versionParts[1]
                  $patch = [int]$versionParts[2] + 1
                  
                  $json.version = "${major}.${minor}.${patch}"
                  Write-Host "Новая версия расширения: $($json.version)"
              }
          } else {
              $json | Add-Member -NotePropertyName "version" -NotePropertyValue "1.0.0"
          }
          
          # Сохраняем новую версию в переменную окружения GitHub Actions для использования в коммите
          echo "ext_version=$($json.version)" >> $env:GITHUB_OUTPUT
          
          # ИСПРАВЛЕНИЕ ИМЕНИ
          if ($json.name -match "suscersal\.") {
              $json.name = $json.name -replace "suscersal\.", ""
          }
          $json.name = $json.name.ToLower()
          
          # Автоматически добавляем обязательные поля
          if (-not $json.publisher) { $json | Add-Member -NotePropertyName "publisher" -NotePropertyValue "suscersal" }
          if (-not $json.repository) { $json | Add-Member -NotePropertyName "repository" -NotePropertyValue @{ type = "git"; url = "https://github.com" } }
          
          # Преобразуем обратно в красивый JSON-текст
          $jsonString = $json | ConvertTo-Json -Depth 10
          
          # Сохраняем в чистом UTF-8 БЕЗ BOM
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Get-Item package.json).FullName, $jsonString, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "LICENSE"), "MIT License", $utf8NoBom)
          
          # Сборка локального .vsix пакета (оставляем для архивов/релизов GitHub)
          vsce package --no-dependencies

      # НОВЫЙ ШАГ: Сохраняем измененный package.json обратно в ваш репозиторий GitHub
      - name: Коммит и Пуш новой версии в репозиторий
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем package.json (находится в папке rus-python)
          git add rus-python/package.json
          
          # Проверяем, есть ли реальные изменения, чтобы не вызывать ошибку пустого коммита
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore: bump extension version to ${{ steps.vsce_setup.outputs.ext_version }} [skip ci]"
              git push origin HEAD:${{ github.head_ref || github.ref_name }}
          } else {
              Write-Host "Изменений в package.json не обнаружено."
          }

      # НОВЫЙ ШАГ: Публикация расширения в официальный VS Code Marketplace
      - name: Публикация в VS Code Marketplace
        continue-on-error: true
        shell: powershell
        run: |
          cd rus-python
          # Публикуем напрямую (команда сама подхватит текущую версию из обновленного package.json)
          vsce publish --no-dependencies
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }} # Не забудьте добавить этот токен в Settings вашего репозитория!

      # Компиляция инсталлятора Inno Setup
      - name: Компиляция инсталлятора (Inno Setup)
        run: |
          iscc setup.iss

      - name: Сохранение готовых файлов в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rupython-artifacts
          path: |
            dist/
            Setup_Build/rupyInstaller.exe
            *.exe
            *.log
            rus-python/*.vsix
          if-no-files-found: warn

      # Создание релиза по тегу, расписанию или вручную с выводом даты и времени
      - name: Создать Релиз и загрузить файлы
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('auto-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Релиз {0}', github.ref_name) || format('Автосборка от {0}', steps.datetime.outputs.build_time) }}
          generate_release_notes: true
          body: |
            ### Автоматическая сборка проекта
            
            **Информация о сборке:**
            - **Дата и время:** ${{ steps.datetime.outputs.build_time }} (UTC раннера)
            - **Триггер:** ${{ github.event_name }}
            - **Коммит:** ${{ github.sha }}
            - **Версия расширения VS Code:** ${{ steps.vsce_setup.outputs.ext_version }}
            
            ---
            ### Что нового:
          draft: false
          prerelease: ${{ github.event_name != 'create' }}
          files: |
            dist/*.exe
            Setup_Build/rupyInstaller.exe
            *.exe
            rus-python/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
