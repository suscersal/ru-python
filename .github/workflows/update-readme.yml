name: Update README translations

on:
  push:
    branches: [main]
    paths:
      - 'rus-python/modules.json'
      - 'rus-python/update_readme.py'
      - 'rus-python/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rus-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate README table
        run: python update_readme.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull

          git add README.md
          git diff --cached --quiet || git commit -m "docs: update translations table"
          git push